name: Tests

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve version and output paths
        id: paths
        run: |
          $build = & .\scripts\build-config.ps1
          "root=$($build.ReleaseRoot)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "verification=$($build.Verification)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne ('v' + $build.Version)) {
            throw 'The release tag must match version.json.'
          }
      - name: Build, test and package
        run: .\scripts\package.ps1
      - name: Write test summary
        if: always()
        env:
          VERIFICATION_DIR: ${{ steps.paths.outputs.verification }}
        run: |
          $log = Join-Path $env:VERIFICATION_DIR 'core_tests.txt'
          if (Test-Path -LiteralPath $log) {
            $summary = @('## Test results', '', '```text') + @(Get-Content -LiteralPath $log) + @('```')
            $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
      - name: Upload portable build and test evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SerialLinkTester-build
          path: ${{ steps.paths.outputs.root }}
          if-no-files-found: error
          retention-days: 14

  release:
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SerialLinkTester-build
          path: release-download
      - name: Publish verified portable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $build = & .\scripts\build-config.ps1
          if ($env:RELEASE_TAG -ne ('v' + $build.Version)) { throw 'Version/tag mismatch.' }
          $files = @(
            '.\release-download\app\SerialLinkTester.exe',
            (Join-Path '.\release-download' ('SerialLinkTester_v' + $build.Version + '_Windows.zip')),
            '.\release-download\app\release_manifest.json'
          )
          $checksums = @($files | ForEach-Object {
            (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + [IO.Path]::GetFileName($_)
          })
          $checksumFile = '.\release-download\SHA256SUMS.txt'
          $checksums | Set-Content -LiteralPath $checksumFile -Encoding ascii
          $notes = Join-Path '.\docs\releases' ($env:RELEASE_TAG + '.md')
          gh release create $env:RELEASE_TAG @files $checksumFile --verify-tag --title ('Serial Link Tester ' + $env:RELEASE_TAG) --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed.' }
